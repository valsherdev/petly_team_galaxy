<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Role Selection</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col h-lvh">
<div th:replace="~{fragments/navbars :: navbar_role_selector}"></div>
<div class="flex flex-col items-center justify-start pt-8 pb-12 px-4 flex-grow max-w-4xl mx-auto w-full">

    <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 mb-2 text-center">
        Welcome to
        <span class="italic font-extrabold tracking-tight text-emerald-600 hover:text-emerald-700">Petly!</span>
    </h1>
    <p class="text-gray-600 text-base text-center mb-2">
        Connecting loving pet owners with trusted care providers.
    </p>

    <form action="/users/select-role" method="POST" class="w-full max-w-4xl space-y-6">

        <div class="bg-white p-6 rounded-2xl flex flex-col items-center">
            <label for="name" class="block text-sm font-semibold text-gray-700 mb-2 text-center">
                Your Name / Business Name:
            </label>
            <input class="w-full max-w-md text-center px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 outline-none placeholder-gray-400 text-gray-800 bg-gray-50/50"
                   type="text" id="name" name="name" required placeholder="e.g. Alex Smith or Happy Paws Care"/>
        </div>

        <p class="text-xs font-bold uppercase tracking-wider text-gray-400 text-center">
            Select Your Account Type
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">

            <div class="bg-[#caeddf] rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-between text-center gap-6 hover:shadow-md">
                <div class="w-32 h-32 flex-shrink-0 flex items-center justify-center bg-emerald-50 rounded-full overflow-hidden">
                    <img th:src="@{/images/pet_owner.jpeg}" alt="Pet Owner" class="w-full h-full object-cover" />
                </div>

                <div class="flex flex-col items-center justify-between flex-grow space-y-4 w-full">
                    <h3 class="text-xl font-bold text-gray-800 leading-snug">
                        Find pet care, grooming, and veterinary services near you
                    </h3>
                    <button class="w-full px-6 py-3.5 bg-[#59ba93] hover:bg-emerald-600 text-white font-bold rounded-xl shadow-sm active:scale-95 cursor-pointer flex items-center justify-center gap-2"
                            type="submit" name="role" value="PET_OWNER">
                        <span>🐾</span>
                        <span>I'm a Pet Owner</span>
                    </button>
                </div>
            </div>

            <div class="bg-[#cad5ed] rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-between text-center gap-6 hover:shadow-md">
                <div class="w-32 h-32 flex-shrink-0 flex items-center justify-center bg-emerald-50 rounded-full overflow-hidden">
                    <img th:src="@{/images/service_provider.jpeg}" alt="Service Provider" class="w-full h-full object-cover" />
                </div>

                <div class="flex flex-col items-center justify-between flex-grow space-y-4 w-full">
                    <h3 class="text-xl font-bold text-gray-800 leading-snug">
                        Share your pet services and connect with local owners
                    </h3>
                    <button class="w-full px-6 py-3.5 bg-[#7794d1] hover:bg-[#4c6db4] text-white font-bold rounded-xl shadow-sm active:scale-95 cursor-pointer flex items-center justify-center gap-2"
                            type="submit" name="role" value="SERVICE_PROVIDER">
                        <span>💼</span>
                        <span>I'm a Service Provider</span>
                    </button>
                </div>
            </div>

        </div>

    </form>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
