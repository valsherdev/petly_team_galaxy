<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Messages - Petly</title>
  <link rel="stylesheet" href="/css/output.css">
</head>
<body>
<div th:if="${user.role == 'SERVICE_PROVIDER'}">
  <div th:replace="~{fragments/navbars :: navbar_service_provider}"></div>
</div>
<div th:if="${user.role == 'PET_OWNER'}">
  <div th:replace="~{fragments/navbars :: navbar_pet_owner}"></div>
</div>

<main>
  <h1>Messages</h1>

  <div th:each="message : ${conversations}"
       th:with="partner=${message.sender.id == currentUserId} ? ${message.recipient} : ${message.sender},
                  unreadCount=${unreadCountByPartnerId.get(partner.id)}">
    <a th:href="@{/messages/{id}(id=${partner.id})}">
      <strong th:text="${partner.name}"></strong>
      <span th:text="${message.content}"></span>
      <span th:text="${#temporals.format(message.createdAt, 'dd MMM, HH:mm')}"></span>
      <span th:if="${unreadCount > 0}" th:text="'(' + ${unreadCount} + ' unread)'"></span>
    </a>
    <hr/>
  </div>
  <p th:if="${conversations.isEmpty()}">No conversations yet.</p>
</main>
</body>
</html>
