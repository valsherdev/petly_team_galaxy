<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Pet Profile</title>
  <link rel="stylesheet" href="/css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col h-lvh">
<div th:replace="~{fragments/navbars :: navbar_pet_owner}"></div>
<div class="flex flex-col items-center justify-start pt-8 pb-12 px-4 flex-grow max-w-4xl mx-auto w-full">

  <form th:action="@{/my-pets/add}" th:object="${pet}" method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-4">

    <h1 class="text-3xl font-extrabold text-gray-900 text-center mb-6">
      Add Pet Profile
    </h1>

    <div>
      <label class="block text-xs font-semibold text-gray-400 mb-1 ml-3">PHOTO</label>
      <label class="block w-full bg-slate-50 border border-slate-200 rounded-full px-5 py-3 text-sm font-medium text-gray-500 cursor-pointer hover:bg-slate-100">
        <input type="file" name="image" accept="image/*" class="file:hidden">
        <span class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-5 py-2 rounded-full shadow-sm">Select File</span>
       </label>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-400 mb-1 ml-3">NAME</label>
      <input type="text" th:field="*{name}" required
             class="w-full bg-slate-50 border border-slate-200 rounded-full px-5 py-3 text-sm font-medium text-gray-900 focus:ring-2 focus:ring-emerald-500">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-400 mb-1 ml-3">TYPE</label>
      <input type="text" th:field="*{type}" list="pet-types" placeholder="Select from dropdown or type if not listed (e.g. Snake)" required
             class="w-full bg-slate-50 border border-slate-200 rounded-full px-5 py-3 text-sm font-medium text-gray-900 focus:ring-2 focus:ring-emerald-500">

        <datalist id="pet-types">
          <option value="Dog">
          <option value="Cat">
          <option value="Rabbit">
          <option value="Guinea Pig">
          <option value="Hamster">
        </datalist>
        </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1 ml-3">AGE (YEARS)</label>
        <input type="number" th:field="*{age}" required
               class="w-full bg-slate-50 border border-slate-200 rounded-full px-5 py-3 text-sm font-medium text-gray-900 focus:ring-2 focus:ring-emerald-500">
      </div>


    <div>
      <label class="block text-xs font-semibold text-gray-400 mb-1 ml-3">BREED</label>
      <input type="text" th:field="*{breed}" required
             class="w-full bg-slate-50 border border-slate-200 rounded-full px-5 py-3 text-sm font-medium text-gray-900 focus:ring-2 focus:ring-emerald-500">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-400 mb-1 ml-3">DESCRIPTION</label>
      <textarea th:field="*{description}" rows="3" placeholder="E.g. Neutered, fully vaccinated, very playful, sensitive stomach..."
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3 text-sm font-medium text-gray-900 focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
    </div>

    <div class="pt-4 flex gap-3">
      <button type="submit" class="flex-1 bg-emerald-600 text-white font-bold py-3.5 rounded-full hover:bg-emerald-700 shadow-md text-sm">Add pet</button>
      <button type="reset" value="reset" class="px-6 py-3.5 bg-slate-100 text-gray-600 font-bold rounded-full hover:bg-slate-200 text-center text-sm border border-slate-200">Reset</button>
      <a th:href="@{/my-pets}" class="px-6 py-3.5 bg-slate-100 hover:bg-slate-200 text-gray-600 font-bold rounded-full text-sm border border-slate-200">Cancel</a>
    </div>

  </form>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
