<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Pets</title>
    <link rel="stylesheet" href="/css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col h-lvh">
<div th:replace="~{fragments/navbars :: navbar_pet_owner}"></div>
<div class="flex flex-col items-center justify-start pt-8 pb-12 px-4 flex-grow max-w-4xl mx-auto w-full">

    <div>
        <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 mb-2 text-center">
            My Pets
        </h1>
        <p class="text-gray-500 text-sm mt-1 mb-3">
            Manage your pets or add a new companion.
        </p>
    </div>
    <!--    <a href="/my-pets/add">Add a pet</a>-->

    <div th:if="${pets.empty}">
        <p>You haven't added any pets to your profile</p>
    </div>

<!--    <div th:each="pet : ${pets}">-->
<!--        Name: <span th:text="${pet.name}">Name</span>-->
<!--        Type: <span th:text="${pet.type}">Type</span>-->
<!--        Breed: <span th:text="${pet.breed}">Breed</span>-->
<!--        Age: <span th:text="${pet.age}">Age</span>-->
<!--        Description: <span th:text="${pet.description}">Description</span>-->

<!--        <a th:href="@{/my-pets/{id}/edit(id=${pet.id})}">Edit</a>-->
<!--    </div>-->

<!--    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-100">-->
<!--        <div>-->
<!--            <p class="text-gray-500 text-sm mt-1">Manage your registered pets or add a new companion.</p>-->
<!--        </div>-->
<!--        <a th:href="@{/my-pets/add}"-->
<!--           class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm transition-all hover:shadow-md cursor-pointer text-sm">-->
<!--            + Add a Pet-->
<!--        </a>-->
<!--    </div>-->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 justify-items-start">

        <div th:each="pet : ${pets}" class="w-72 bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 flex flex-col justify-between">

            <div>
                <div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-400 font-medium">
<!--                    <span>Image Placeholder</span>-->
                    <img th:src="${pet.photo}" alt="Image" class="w-full h-full object-cover object-center">
                </div>

                <div class="p-6">

                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-extrabold text-2xl text-gray-900" th:text="${pet.name}">Name</h3>
                        <span class="px-3 py-1 bg-[#c9f0de] text-gray-700 text-xs font-bold rounded-full capitalize"
                              th:text="${pet.type}">Type</span>
                    </div>

                    <div class="space-y-1 text-sm text-gray-700 mb-3">
                        <p><span class="font-bold text-gray-900">Breed:</span> <span th:text="${pet.breed}">Breed</span></p>
                        <p><span class="font-bold text-gray-900">Age:</span> <span th:text="${pet.age} + ' yrs'">Age</span></p>
                    </div>

                    <p th:text="${pet.description}" class="text-sm text-gray-600 leading-relaxed">Description</p>
                </div>

            </div>

            <div>
                <div class="px-6 pb-4 grid grid-cols-2 gap-3">
                    <a th:href="@{/my-pets/{id}/edit(id=${pet.id})}"
                       class="inline-block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-md">
                        Update
                    </a>
                    <form th:action="@{/my-pets/{id}/delete(id=${pet.id})}" method="post" class="w-full" onclick="return confirm('Are you sure you want to delete this pet?')">
                        <button type="submit"
                                class="w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold py-2 px-4 rounded-md border border-gray-200 cursor-pointer transition-colors">
                            Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <a th:href="@{/my-pets/add}"
           class="w-72 min-h-[420px] rounded-2xl border-2 border-dashed border-gray-300 hover:border-emerald-500 bg-gray-50/50 hover:bg-emerald-50/30 flex flex-col items-center justify-center group cursor-pointer p-6 text-center">

            <div class="w-14 h-14 bg-white rounded-full shadow-md flex items-center justify-center text-emerald-600 mb-4 group-hover:scale-110">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <h4 class="text-lg font-bold text-gray-800 group-hover:text-emerald-700 transition-colors">Add Another Pet</h4>
            <p class="text-xs text-gray-500 mt-1">Register a new profile for your pet</p>
        </a>

    </div>


</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
