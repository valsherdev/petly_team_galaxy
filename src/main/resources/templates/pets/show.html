<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pet.name} + ' - Petly'">Pet Profile</title>
    <link rel="stylesheet" href="/css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col h-lvh">
<div th:replace="~{fragments/navbars :: navbar_service_provider}"></div>

<div class="flex flex-col items-center justify-start pt-8 pb-12 px-4 flex-grow max-w-4xl mx-auto w-full">

    <section class="w-full bg-gradient-to-r from-[#cad5ed]/40 via-[#cad5ed]/20 to-white rounded-2xl shadow-sm border border-[#cad5ed] p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-[#cad5ed]/50 text-[#7794d1] border border-[#7794d1]/40 flex items-center justify-center text-2xl shadow-sm shrink-0">
                🐾
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800" th:text="${pet.name}"></h1>
                <p class="text-xs sm:text-sm text-slate-600">Pet profile</p>
            </div>
        </div>
        <a th:href="@{/dashboard/provider/bookings}" class="self-start md:self-auto text-xs font-semibold text-slate-600 hover:text-slate-900 bg-white border border-[#cad5ed] px-4 py-2.5 rounded-xl shadow-sm hover:shadow">
            ← Back to Booking Requests
        </a>
    </section>

    <div class="w-72 bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 flex flex-col justify-between">

        <div>
            <div class="w-full h-48 bg-gray-200 flex items-center justify-center text-gray-400 font-medium">
                <img th:if="${pet.photo != null and !pet.photo.isEmpty()}"
                     th:src="${pet.photo}" th:alt="${pet.name}" class="w-full h-full object-cover object-center">

                <img th:unless="${pet.photo != null and !pet.photo.isEmpty()}"
                     th:src="@{/images/animal_default.jpeg}" th:alt="${pet.name}" class="w-full h-full object-cover object-center">
            </div>

            <div class="p-6">

                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-extrabold text-2xl text-gray-900" th:text="${pet.name}">Name</h3>
                    <span class="px-3 py-1 bg-[#c9f0de] text-gray-700 text-xs font-bold rounded-full capitalize"
                          th:text="${pet.type}">Type</span>
                </div>

                <div class="space-y-1 text-sm text-gray-700 mb-3">
                    <p><span class="font-bold text-gray-900">Breed:</span> <span th:text="${pet.breed}">Breed</span></p>
                    <p><span class="font-bold text-gray-900">Age:</span> <span th:text="${pet.age} + ' yrs'">Age</span></p>
                    <p><span class="font-bold text-gray-900">Owner:</span> <span th:text="${pet.owner.name}">Owner</span></p>
                </div>

                <p th:text="${pet.description}" class="text-sm text-gray-600 leading-relaxed">Description</p>
            </div>

        </div>

        <div>
            <div class="px-5 pb-5 pt-1">
                <a th:href="@{/messages/{id}(id=${pet.owner.id})}"
                   class="inline-block w-full text-center bg-[#7794d1] hover:bg-[#5e7bb8] text-white font-semibold text-xs py-2 px-3 rounded-xl transition-all shadow-sm">
                    Message the owner
                </a>
            </div>
        </div>
    </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
