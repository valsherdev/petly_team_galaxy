<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Petly</title>
    <link rel="stylesheet" href="/css/output.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col h-lvh bg-gray-50">
<div th:replace="~{fragments/navbars :: navbar_pet_owner}"></div>
<div class="flex flex-col flex-grow w-full max-w-4xl mx-auto px-4 py-8 space-y-6">

    <section>
        <div class="bg-gradient-to-r from-emerald-500/10 via-emerald-500/5 to-white border border-emerald-200/80 rounded-3xl p-6 sm:p-8 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-2xl font-bold shrink-0 shadow-sm border border-emerald-200">
                    👤
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800">My Profile</h1>
                    <p class="text-xs sm:text-sm text-slate-600 mt-0.5">View your profile details and update your location.</p>
                </div>
            </div>
            <a th:href="@{/dashboard/owner}" class="self-start md:self-auto text-xs font-bold text-slate-700 hover:text-emerald-800 bg-white hover:bg-emerald-50/50 border border-emerald-200 px-4 py-3 rounded-2xl transition-all shadow-sm flex items-center gap-1.5">
                ← Back to Dashboard
            </a>
        </div>
    </section>

    <section class="w-full bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-100">
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">
                    NAME
                </label>
                <p class="text-lg font-semibold text-gray-800 ml-1" th:text="${user.name}"></p>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">
                    EMAIL
                </label>
                <p class="text-lg font-semibold text-gray-800 ml-1" th:text="${user.username}"></p>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-5">
                Your Location
            </h2>
            <form th:action="@{/profile/location}" method="POST" class="space-y-5">
                <div>
                    <label for="location" class="block text-xs font-semibold text-gray-400 mb-1 ml-3">
                        POSTCODE
                    </label>
                    <input type="text" id="location" th:field="*{user.location}" placeholder="e.g. SW1A 1AA" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-full px-5 py-3 text-sm font-medium text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none">
                </div>
                <p th:if="${postcodeError}" th:text="${postcodeError}" class="text-sm font-medium text-red-700 ml-3"></p>
                <p th:if="${locationSuccess}" th:text="${locationSuccess}" class="text-sm font-medium text-emerald-700 ml-3"></p>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-full hover:bg-emerald-700 shadow-md text-sm transition-colors cursor-pointer">
                        Save Location
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
