<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Services - Petly</title>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body>
<div th:replace="~{fragments/navbars :: navbar_pet_owner}"></div>

<main>
    <section>
        <h1>Browse Services</h1>

        <nav>
            <a th:href="@{/services}">All</a> |
            <a th:href="@{/services(type='PET_CARE')}">Pet Care</a> |
            <a th:href="@{/services(type='GROOMING')}">Grooming</a> |
            <a th:href="@{/services(type='VETERINARY')}">Veterinary</a>
        </nav>
    </section>

<hr/>

    <section>
        <div th:if="${not #lists.isEmpty(services)}">
            <article th:each="service : ${services}">
                <h3 th:text="${service.name}"></h3>
                <p th:text="'Provided by ' + ${service.provider.name}"></p>
                <p th:text="${service.description}"></p>

                <p>
                    <strong>Duration:</strong>
                    <span th:text="${service.durationMinutes} != null ? ${service.durationMinutes} + ' mins' : 'Flexible'"></span>
                </p>

                <p>
                    <strong>Price:</strong>
                    £<span th:text="${service.price}"></span>
                    <span th:if="${service.priceUnit != null and service.priceUnit != 'FIXED'}"
                          th:text="'/ ' + ${#strings.toLowerCase(service.priceUnit).replace('per_', '')}"></span>
                </p>

                <p th:if="${distances.containsKey(service.id)}">
                    <strong>Distance:</strong>
                    <span th:text="${#numbers.formatDecimal(distances.get(service.id), 1, 1)} + ' km away from your location'"></span>
                </p>

                <a th:href="@{/services/{id}/book(id=${service.id})}">Book this service</a>
                <a th:href="@{/messages/{id}(id=${service.provider.id})}">Send a message</a>

                <hr/>
            </article>
        </div>
        <p th:if="${#lists.isEmpty(services)}">No services found.</p>
    </section>
</main>
</body>
</html>
